<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Info App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Serif:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <main class="app-shell">
    <header class="hero">
      <p class="eyebrow">Last.fm Explorer</p>
      <h1>Music Info App</h1>
      <p class="subtitle">Cari artis atau lagu, lalu lihat genre, biografi, top tracks, dan detail menarik lainnya dari Last.fm.</p>
    </header>

    <section class="search-panel" aria-label="Panel pencarian musik">
      <div class="input-wrap">
        <label for="query">Ketik nama artis atau judul lagu</label>
        <input id="query" type="text" placeholder="Contoh: Coldplay / Yellow" autocomplete="off" />
      </div>

      <div class="input-wrap compact">
        <label for="searchType">Mode pencarian</label>
        <select id="searchType">
          <option value="artist">Artis</option>
          <option value="track">Lagu</option>
        </select>
      </div>

      <button id="searchBtn" type="button">Cari Info</button>
    </section>

    <section id="status" class="status" aria-live="polite"></section>

    <section id="result" class="result hidden" aria-live="polite">
      <article class="artist-card">
        <div class="artist-head">
          <img id="artistImage" src="" alt="Foto artis" class="artist-image" />
          <div>
            <h2 id="artistName">-</h2>
            <p id="artistListeners" class="muted"></p>
            <a id="artistLink" href="#" target="_blank" rel="noopener noreferrer">Lihat profil di Last.fm</a>
          </div>
        </div>

        <div class="pill-row">
          <span class="pill-title">Genre</span>
          <div id="genreList" class="pill-list"></div>
        </div>

        <div class="bio-wrap">
          <h3>Biografi</h3>
          <p id="artistBio">-</p>
        </div>
      </article>

      <article class="track-card">
        <h3>Top Tracks</h3>
        <ol id="topTracks" class="track-list"></ol>

        <h3>Top Albums</h3>
        <ol id="topAlbums" class="track-list"></ol>

        <h3>Similar Artists</h3>
        <ul id="similarArtists" class="track-list similar-list"></ul>
      </article>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
